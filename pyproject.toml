[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tool-schema-lint"
version = "0.1.0"
description = "A linter for LLM tool definitions: strict-mode compatibility, descriptions, names, overlap, enums."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oğuzhan Balım" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
tool-schema-lint = "tool_schema_lint.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tool_schema_lint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
